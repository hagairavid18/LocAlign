trainer:
  exp_name: "dp005-3blocks-bn-wd-no-scalar-layer-no-grad-clip-no-guess-no-skips-hd512-vir5"
  tags: ["virtual", "pocket", "shared", "all_caths", "grouping_1302", "800"]
  max_epochs: 50
  validate_only: false
  check_val_every_n_epoch: 2
  gradient_clipping: 15
  profiler: false
  # ckpt_path: "checkpoints/viz-grouping-train-for-viz-corr-offsets-upto2-scalarmatrix-005dp-30epoch-ligandloss-fix/epoch=23-step=25440.ckpt"
  ckpt_path: null
model:
  name: VirtualSoftBB
  args:
    # plot_dir: "plots/viz-grouping-train-for-viz-corr/train"
    plot_dir: null
    max_iter: 5
    n_iter_train: 2
    input_layer:
      name: 
        FeatureBlockGPT
      args:
        skip_connection: True
        n_blocks: 3
        input_dim: 256
        hidden_dim: 256
        output_dim: 256
        dropout: 0.02
        normalization: LayerNorm
    virtual_layer:
      name: 
        FeatureBlockGPT
      args:
        skip_connection: false
        n_blocks: 3
        input_dim: 256
        hidden_dim: 256
        output_dim: 3
        dropout: 0.05
        normalization: LayerNorm
        norm_in_last_layer: False
    # scalar_layer:
    #   name: 
    #     FeatureBlockGPT
    #   args:
    #     skip_connection: false
    #     n_blocks: 3
    #     input_dim: 256
    #     hidden_dim: 256
    #     output_dim: 1
    #     dropout: 0.2
    #     normalization: BatchNorm
    #     norm_in_last_layer: False
    loss:
      use_transformation: false
      pocket:
        name: PocketLoss
        args: {"return_non_linear": True}
      transformation:
        name: RTLoss
        args: {"translation_weight": 0.1}
    optimizer:
      name: Adam
      args:
        learning_rate: 0.0005
        scheduler:
          name: OneCycleLR
          args:
            max_lr: 0.0005
            epochs: 50
            steps_per_epoch: 1500
            three_phase: True
            final_div_factor: 5
            div_factor: 10

dataset:
  train:
    name: ScannetDataset
    args:
      df_path: datasets/csv_files/grouping_1302/train.csv
      # n_samples: 100
      seed: 41
      min_cath: 0
      max_cath: 3
      bbr_filter_ratio: 0.3
      level: "pocket"
  validation:
    name: ScannetDataset
    args:
      df_path: datasets/csv_files/grouping_1302/val.csv
      # n_samples: 100
      seed: 81
      min_cath: 0
      max_cath: 3
      level: "pocket"
dataloader:
  train_batch_size: 12
  valid_batch_size: 1
  test_batch_size: 1
  n_workers: 20