trainer:
  exp_name: "add-ligand-rmsd-loss-is-on-ligand"
  max_epochs: 40
  validate_only: false
  check_val_every_n_epoch: 3
  gradient_clipping: 30.0
  profiler: false
  # ckpt_path: "checkpoints/new-pockets/epoch=29-step=19560.ckpt"
  ckpt_path: null
model:
  name: LearnableSoftBB
  args:
    plot_alignments: False
    max_iter: 5
    compute_pocket_importance: True
    use_scalar_layer: true
    input_layer:
      name:
        FeatureBlockGPT
      args:
        skip_connection: True
        n_blocks: 3
        input_dim: 128
        hidden_dim: 256
        output_dim: 128
        dropout: 0.05
    scalar_layer:
      name:
        FeatureBlockGPT
      args:
        skip_connection: False
        n_blocks: 2
        input_dim: 128
        hidden_dim: 64
        output_dim: 1
        dropout: 0.05
    loss:
      use_transformation: False
      pocket:
        name: PocketLoss
        args: {"return_non_linear": True}
      transformation:
        name: RTLoss
        args: {"translation_weight": 0.001}
    optimizer:
      name: Adam
      args:
        learning_rate: 0.001
dataset:
  train:
    name: ScannetDataset
    args:
      df_path: datasets/csv_files/no_grouping/train.csv
      # n_samples: 100
      seed: 81
      min_cath: 1
  validation:
    name: ScannetDataset
    args:
      df_path: datasets/csv_files/no_grouping/val.csv
      # n_samples: 100
      seed: 81
      min_cath: 1
  test:
    name: ScannetDataset
    args:
      df_path: datasets/csv_files/no_grouping/test.csv
      seed: 81
      min_cath: 1
dataloader:
  train_batch_size: 4
  valid_batch_size: 1
  test_batch_size: 1
  n_workers: 30