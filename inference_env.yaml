name: inference_env

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - numpy
  - pandas
  - biopython
  - scipy
  - scikit-learn
  - numba
  - matplotlib
  - python-dotenv
  - rdkit
  - pip

  - pip:
      - keras
      - fair-esm==2.0.0
      - lightning==2.5.6
      - torch==2.9.0
      - torch_geometric==2.7.0
      - --extra-index-url https://download.pytorch.org/whl/cu128
