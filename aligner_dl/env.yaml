name: aligner_dl

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults  

dependencies:
  - python=3.10  
  - numpy       
  - pandas      
  - matplotlib  
  - biopython
  - scipy
  - pip
  - conda-build

  - pip:
      - pytorch-lightning
      - lightning
      - torchmetrics
      - torch
      - torch_geometric
      - torchvision
      - torchaudio
      - comet-ml
      - python-dotenv
      - --extra-index-url https://download.pytorch.org/whl/cu124
