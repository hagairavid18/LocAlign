name: aligner_dl

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults  

dependencies:
  - python=3.10  
  - numpy       
  - pandas      
  - matplotlib  
  - biopython
  - scipy
  # - pytorch=2.6.0
  # - pytorch-cuda=12.1  # Ensure this version is installed correctly
  # - torchvision=0.21.0
  - plotly
  - pip
  - conda-build

  - pip:
      - pytorch-lightning
      - lightning
      - torchmetrics
      - torch
      - torchvision
      - torchaudio
      - comet-ml 
      - --extra-index-url https://download.pytorch.org/whl/cu124
