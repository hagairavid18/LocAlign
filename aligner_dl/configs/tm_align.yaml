trainer:
  exp_name: "infer-TM-align"
  tags: ["grouping_1302"]
  max_epochs: 30
  validate_only: true
  check_val_every_n_epoch: 2
  gradient_clipping: 30.0
  profiler: false
  # ckpt_path: "checkpoints/test-weight-mlp-reformat/epoch=27-step=18256.ckpt"
  ckpt_path: null
model:
  name: TMaligner
 
dataset:
  train:
    name: ScannetDataset
    args:
      df_path: aligner_dl/datasets/csv_files/grouping_1302/train.csv
      # n_samples: 100
      seed: 81
      level: "residue"
      min_cath: 0
  validation:
    name: ScannetDataset
    args:
      df_path: aligner_dl/datasets/csv_files/grouping_1302/val.csv
      seed: 81
      level: "residue"
      # n_samples: 100
      min_cath: 0
  test:
    name: ScannetDataset
    args:
      df_path: datasets/csv_files/no_grouping/test.csv
      seed: 81
      min_cath: 1
dataloader:
  train_batch_size: 8
  valid_batch_size: 1
  test_batch_size: 1
  n_workers: 15