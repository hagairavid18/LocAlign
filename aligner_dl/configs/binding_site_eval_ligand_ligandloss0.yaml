trainer:
  exp_name: binding-site-eval-ligand-ligandloss0
  tags:
  - binding-site-eval
  - ligand
  max_epochs: 1
  validate_only: true
  check_val_every_n_epoch: 1
  gradient_clipping: 30.0
  ckpt_path: checkpoints/baseline-ligand=split-ligandloss0/epoch=8-step=97191.ckpt
model:
  args:
    denoiser:
      args:
        n_gnn_layers: 10
        n_nodes: 400
        n_rbf_functions: 32
        with_angles: true
      name: CDM
    input_layer:
      args:
        dropout: 0.1
        hidden_dim: 256
        input_dim: 1004
        last_norm_learnable: true
        n_blocks: 2
        norm_in_last_layer: true
        output_dim: 256
      name: EmbeddingBlock
    keypoints_selection:
      args:
        embedding_size: 256
        n_rbf_functions: 32
        top_k: 1000
      name: KeypointsSelection
    loss:
      args:
        embedding_method: contrastive_clip_normalized
        return_non_linear: true
        weight_dict:
          corr_rmsd: 1.0
          embedding: 0.5
          gap: 0.0
          ligand_rmsd: 0.0
          radius: 0.5
      name: LocAlignLoss
    metric:
      args:
        metrics:
          atom_type:
            args: {}
            module: metrics.atom_type_correspondence
            name: AtomTypeCorrespondence
          pocket:
            args: {}
            module: metrics.pocket_ligand_rmsd
            name: PocketRMSD
          binding_site:
            name: BindingSiteCorrespondence
            module: metrics.binding_site_correspondence
            args: {}
      module: metrics.collection
      name: MetricsCollection
    n_iter_recycling: 4
    optimizer:
      args:
        learning_rate: 0.0005
      name: Adam
  name: LocAlign
dataset:
  validation:
    name: ScanNetDataset
    args:
      base_scannet_path: ${SCANNET_DIR}
      df_path: datasets/csv_files/ligand_25_10/val.csv
      esm_layer: 18
      esm_model: esm2_t30_150M_UR50D
      max_cath: 4
      max_length: 5000
      seed: 42
      use_esm: true
dataloader:
  train_batch_size: 8
  valid_batch_size: 8
  n_workers: 12
