# quality0 ablation (quality-loss terms corr_rmsd/embedding/radius set to 0) on the
# ligand-grouped split (datasets/csv_files/ligand_25_10). Reproduces the released
# ligand-split checkpoint (checkpoints/baseline-ligand=split-quality0/epoch=8-step=97191.ckpt).
# Derived from loc_align.yaml plus the run's saved model_config.yaml / dataset_config.yaml
# and the scheduler state stored in the checkpoint (OneCycleLR total_steps = 107800).
#
# Scheduler spans 10 epochs; training stopped after 9 to reproduce the released
# ligand-split checkpoints.
#  - trainer.max_epochs: 9 -> training ends at global step 9 x 10799 = 97191
#    (10799 = len(train_loader) for ligand_25_10/train.csv at batch size 8).
#  - trainer.schedule_epochs: 10 -> the corr-RMSD loss-weight ramp spans 10 x 10799 steps,
#    as in the original run (see lightning_trainer.py).
#  - optimizer.scheduler.args epochs: 10, steps_per_epoch: 10780 -> OneCycleLR
#    total_steps = 107800, the value saved in the original checkpoint. The OneCycleLR length
#    comes only from these args, never from trainer.max_epochs.
trainer:
  exp_name: baseline-ligand=split-quality0
  tags: ["baseline", "ligand_split", "small_ligands", "ablation", "quality0"]
  # Scheduler spans 10 epochs; training stopped after 9 to reproduce the released
  # ligand-split checkpoints.
  max_epochs: 9
  schedule_epochs: 10
  validate_only: false
  check_val_every_n_epoch: 1
  gradient_clipping: 30.0
  # profiler: false
model:
  name: LocAlign
  args:
    n_iter_recycling: 4
    input_layer:
      name: 
        EmbeddingBlock
      args:
        n_blocks: 2
        input_dim: 1004
        hidden_dim: 256
        output_dim: 256
        dropout: 0.1
        norm_in_last_layer: true
        last_norm_learnable: true
    denoiser:
      name: 
        CDM
      args:
        n_nodes: 400
        n_gnn_layers: 10
        n_rbf_functions: 32
        with_angles: true
    keypoints_selection:
      name: KeypointsSelection
      args:
        embedding_size: 256
        n_rbf_functions: 32
        top_k: 1000
    loss:
      name: LocAlignLoss
      args:
        return_non_linear: true
        weight_dict:
          corr_rmsd: 0.0   # quality0 ablation
          embedding: 0.0   # quality0 ablation
          gap: 0.0
          ligand_rmsd: 5.0
          radius: 0.0      # quality0 ablation
        embedding_method: 'contrastive_clip_normalized'
    metric:
      name: MetricsCollection
      module: metrics.collection
      args:
        metrics:
          pocket:
            name: PocketRMSD
            module: metrics.pocket_ligand_rmsd
            args: {}
          atom_type:
            name: AtomTypeCorrespondence
            module: metrics.atom_type_correspondence
            args: {}
          # binding_site: logging-only metric added after these runs (not in the saved
          # model_config.yaml); it does not affect training.
          binding_site:
            name: BindingSiteCorrespondence
            module: metrics.binding_site_correspondence
            args: {}
     
    optimizer:
      name: Adam
      args:
        learning_rate: 0.0005
        scheduler:
          name: OneCycleLR
          interval: step
          args:
            # Scheduler spans 10 epochs (total_steps = 10 x 10780 = 107800, as saved in the
            # original checkpoint); training stops after 9 (trainer.max_epochs).
            max_lr: 0.0005
            epochs: 10
            steps_per_epoch: 10780
            div_factor: 25
            # final_div_factor: 1e4

dataset:
  train:
    name: ScanNetDataset
    args:
      df_path: datasets/csv_files/ligand_25_10/train.csv
      base_scannet_path: '/home/iscb/wolfson/hagairavid/scannet_2212'
      esm_model: "esm2_t30_150M_UR50D"
      use_esm: true
      esm_layer: 18
      # n_samples: 30
      seed: 41
      # min_cath: 3
      max_cath: 8
      bbc_filter_ratio: 20
      max_length: 2000
  validation:
    name: ScanNetDataset
    args:
      # Held-out test set (formerly val.csv), evaluated and logged every epoch.
      df_path: datasets/csv_files/ligand_25_10/test.csv
      base_scannet_path: '/home/iscb/wolfson/hagairavid/scannet_2212'
      esm_model: "esm2_t30_150M_UR50D"
      use_esm: true
      # n_samples: 10
      esm_layer: 18
      seed: 81
      max_cath: 4
      # bbr_filter_ratio: 0.3
      max_length: 5000
dataloader:
  train_batch_size: 8
  valid_batch_size: 8
  n_workers: 12