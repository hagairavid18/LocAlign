trainer:
  exp_name: "infer-virtual-bbs"
  # ckpt_path: "/home/iscb/wolfson/hagairavid/LocAlign/checkpoints/maskedln-atom-256-dp000-no-div-dist-tis10-b8/epoch=7-step=20200.ckpt"
model:
  name: VirtualSoftBB
  args:
    plot_dir: "plots/infer-virtual-bbs/val"
    max_iter: 5
    n_iter_train: 2

    input_layer:
      name: 
        EmbeddingBlock
      args:
        n_blocks: 3
        input_dim: 256
        hidden_dim: 256
        output_dim: 256
        dropout: 0.0

    virtual_layer:
      name: 
        EmbeddingBlock
      args:
        n_blocks: 1
        input_dim: 256
        output_dim: 3

    scalar_layer:
      name: 
        EmbeddingBlock
      args:
        n_blocks: 1
        input_dim: 256
        output_dim: 1
        bias: false
        
    loss:
      use_transformation: false
      pocket:
        name: PocketLoss
        args: {"return_non_linear": True}
      ligand:
        name: LigandLoss
        args: {}
      transformation:
        name: RTLoss
        args: {"translation_weight": 0.1}
    optimizer:
      name: Adam
      args:
        learning_rate: 0.0005
       
dataset:
  validation:
    name: ScannetDataset
    args:
      df_path: /home/iscb/wolfson/hagairavid/LocAlign/aligner_dl/datasets/csv_files/grouping_1302/val.csv
      n_samples: 15
      seed: 81
      max_cath: 8
      bbr_filter_ratio: 0.3
      level: "atom"
dataloader:
  valid_batch_size: 1
  n_workers: 0