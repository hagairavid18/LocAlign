trainer:
  exp_name: gnn-mlp2
  tags: ["virtual", "atom", "grouping_130x`5", "1800", "new_block"]
  max_epochs: 30
  validate_only: false
  check_val_every_n_epoch: 1
  gradient_clipping: 30
  # profiler: true
  # ckpt_path: "checkpoints/recycle-3iter-new-dataset-loss-each-iter/epoch=5-step=25896.ckpt"
model:
  name: VirtualSoftBB
  args:
    # plot_dir: "plots/maskedln-atom-256-.a?KB6Pea3Pq%_pocketloss-dp002/val"
    max_iter: 1
    n_iter_train: 1
    top_k: 1000
    n_iter_recycling: 2
    input_layer:
      name: 
        EmbeddingBlock
      args:
        n_blocks: 3
        input_dim: 768
        hidden_dim: 256
        output_dim: 256
        dropout: 0.0
        norm_in_last_layer: false
    scalar_layer:
      name: 
        EmbeddingBlock
      args:
        n_blocks: 3
        input_dim: 256
        output_dim: 1
        bias: false
        dropout: 0.0
      
    denoiser:
      name: 
        CorrespondenceDenoisingModule
      args:
        n_nodes: 100
        n_gnn_layers: 1
        n_rbf_functions: 32
        with_angles: true
    loss:
      use_transformation: false
      pocket:
        name: PocketLoss
        args: {"return_non_linear": True}
      ligand:
        name: LigandLoss
        args: {}
      transformation:
        name: RTLoss
        args: {"translation_weight": 0.1}
    optimizer:
      name: Adam
      args:
        learning_rate: 0.0002
        scheduler:
          name: OneCycleLR
          interval: step
          args:

            max_lr: 0.0002
            epochs: 30
            steps_per_epoch: 2365 
            div_factor: 25
            # final_div_factor: 1e4

dataset:
  train:
    name: ScannetDataset
    args:
      df_path: datasets/csv_files/homology_0507_05/train.csv
      base_embedding_path: '/home/iscb/wolfson/hagairavid/scannet_outputs'
      esm_model: "esm2_t30_150M_UR50D"
      esm_layer: 30
      # n_samples: 3000
      seed: 41
      # min_cath: 3
      max_cath: 8
      bbc_filter_ratio: 20
      level: "atom"
      max_length: 2000
  validation:
    name: ScannetDataset
    args:
      df_path: datasets/csv_files/homology_0507_05/val.csv
      base_embedding_path: '/home/iscb/wolfson/hagairavid/scannet_outputs'
      esm_model: "esm2_t30_150M_UR50D"
      esm_layer: 30
      # n_samples: 15
      seed: 81
      max_cath: 4
      # bbr_filter_ratio: 0.3
      level: "atom"
      max_length: 5000
dataloader:
  train_batch_size: 8
  valid_batch_size: 1
  n_workers: 12