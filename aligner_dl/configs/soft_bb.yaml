trainer:
  exp_name: "softbbs-pocket"
  max_epochs: 40
  validate_only: false
  check_val_every_n_epoch: 3
  gradient_clipping: 30.0
  profiler: false
  # ckpt_path: "checkpoints/add-ligand-rmsd-log-transloss/epoch=23-step=31296.ckpt"
  ckpt_path: null
model:
  name: SoftBB
  args:
    max_iter: 5
    input_layer:
      name: 
        FeatureBlockGPT
      args:
        skip_connection: True
        n_blocks: 3
        input_dim: 256
        hidden_dim: 256
        output_dim: 256
        dropout: 0.05
    scalar_layer:
      name:
        FeatureBlockGPT
      args:
        skip_connection: False
        n_blocks: 2
        input_dim: 256
        hidden_dim: 64
        output_dim: 1
        dropout: 0.05
    loss:
      use_transformation: false
      pocket:
        name: PocketLoss
        args: {"return_non_linear": True}
      transformation:
        name: RTLoss
        args: {"translation_weight": 0.1}
    optimizer:
      name: Adam
      args:
        learning_rate: 0.001
dataset:
  train:
    name: ScanNetDataset
    args:
      df_path: datasets/csv_files/no_grouping/train.csv
      # n_samples: 100
      level: "pocket"
      seed: 81
      min_cath: 1
  validation:
    name: ScanNetDataset
    args:
      df_path: datasets/csv_files/no_grouping/val.csv
      # n_samples: 100
      level: "pocket"
      seed: 81
      min_cath: 1
  test:
    name: ScanNetDataset
    args:
      df_path: datasets/csv_files/no_grouping/test.csv
      seed: 81
      level: "pocket"
      min_cath: 1
dataloader:
  train_batch_size: 8
  valid_batch_size: 1
  test_batch_size: 1
  n_workers: 12