args:
  denoiser:
    args:
      n_gnn_layers: 10
      n_nodes: 400
      n_rbf_functions: 32
      with_angles: true
    name: CDM
  input_layer:
    args:
      dropout: 0.1
      hidden_dim: 256
      input_dim: 1004
      last_norm_learnable: false
      n_blocks: 2
      norm_in_last_layer: true
      output_dim: 256
    name: EmbeddingBlock
  keypoints_selection:
    args:
      embedding_size: 256
      n_rbf_functions: 32
      top_k: 1000
    name: KeypointsSelection
  loss:
    args:
      return_non_linear: true
      weight_dict:
        corr_rmsd: 0.1
        embedding: 2.0
        gap: 0.01
        ligand_rmsd: 5.0
    name: LocAlignLoss
  metric:
    args: {}
    name: PocketRMSD
  n_iter_recycling: 2
  optimizer:
    args:
      learning_rate: 0.0005
    name: Adam
name: LocAlign
